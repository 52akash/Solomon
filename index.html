<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Branded Pay</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f8f9fa; 
        }
        .payment-card { 
            background: #ffffff; 
            padding: 30px 24px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            text-align: center; 
            max-width: 390px; 
            width: 92%; 
            margin: 20px auto;
        }
        .logo-circle {
            width: 65px;
            height: 65px;
            background: #4d49eb;
            color: white;
            font-size: 24px;
            font-weight: bold;
            line-height: 65px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        h2 { color: #1e293b; font-size: 24px; font-weight: 700; margin: 0 0 20px 0; }
        
        .amount-box {
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .amount-label { font-size: 13px; color: #64748b; margin-bottom: 4px; }
        .amount { font-size: 34px; font-weight: 700; color: #0f172a; }
        
        /* Integrated Data Table Style */
        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .status-table td {
            padding: 12px;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            text-align: left;
        }
        .status-table td.label {
            font-weight: 600;
            background-color: #f1f5f9;
            width: 45%;
        }
        .status-table tr:last-child td {
            border-bottom: none;
        }

        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        .input-group input { 
            width: 100%; 
            padding: 12px 16px; 
            font-size: 15px; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            outline: none; 
            color: #334155;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: #4d49eb; }
        .input-group input::placeholder { color: #94a3b8; }

        .btn { 
            background-color: #4d49eb; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 600; 
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(77,73,235,0.15);
        }
        .btn:hover { background-color: #3b37d3; }
        .footer-text { font-size: 13px; color: #94a3b8; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="logo-circle">S</div>
        <h2>Solomon Capital</h2>
        
        <div class="amount-box">
            <div class="amount-label">Amount to Pay</div>
            <div class="amount">₹<span id="paymentAmount">14800.00</span></div>
        </div>

        <!-- Neutral Info Table Layout -->
        <table class="status-table">
            <tr>
                <td class="label">Reference No:</td>
                <td>BLSMPLZ0001</td>
            </tr>
            <tr>
                <td class="label">Status:</td>
                <td style="color: #10b981; font-weight: 600;">ACTIVE</td>
            </tr>
        </table>
        
        <form id="paymentForm">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <button type="submit" class="btn">Pay via Any UPI App</button>
        </form>
        
        <div class="footer-text">
            🔒 100% Secure & Encrypted Payments
        </div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = "14800";
            const merchantName = "Solomon Capital Pvt Ltd";
            const myUpiId = "BHARATPE2T0X0V5G9B83837@unitype"; 
            const upiUrl = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(merchantName)}&am=${amount}&cu=INR&mc=0000&tr=TXN${Date.now()}`;
            window.location.href = upiUrl;
        });
    </script>
</body>
</html>
