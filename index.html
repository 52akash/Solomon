<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solomon Capital Pvt Ltd</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f8f9fa; 
        }
        .payment-card { 
            background: #ffffff; 
            padding: 35px 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 420px; 
            width: 90%; 
            border: 1px solid #eaeaea;
        }
        .logo-placeholder {
            width: 60px;
            height: 60px;
            background: #1a73e8;
            color: white;
            font-size: 24px;
            font-weight: bold;
            line-height: 60px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
        }
        h2 { color: #202124; font-size: 22px; font-weight: 600; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .subtitle { color: #5f6368; font-size: 14px; margin: 0 0 30px 0; }
        .amount-box {
            background: #f1f3f4;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .amount-label { font-size: 12px; color: #5f6368; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .amount { font-size: 36px; font-weight: 700; color: #202124; }
        .btn { 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            padding: 15px 24px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 600; 
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(26,115,232,0.2);
        }
        .btn:hover { background-color: #1557b0; }
        .secure-footer { font-size: 12px; color: #9aa0a6; margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="logo-placeholder">S</div>
        <h2>SOLOMON CAPITAL PVT LTD</h2>
        <div class="subtitle">Secure Business Payment Gateway</div>
        
        <div class="amount-box">
            <div class="amount-label">Requested Amount</div>
            <div class="amount">₹ <span id="paymentAmount">14800</span></div>
        </div>
        
        <form id="paymentForm">
            <button type="submit" class="btn">Pay Securely via UPI</button>
        </form>
        
        <div class="secure-footer">
            🔒 NPCI Certified Secure Gateway
        </div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = document.getElementById('paymentAmount').innerText;
            const merchantName = "Solomon Capital Pvt Ltd";
            const myUpiId = "BHARATPE2T0X0V5G9B83837@unitype"; 
            const upiUrl = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(merchantName)}&am=${amount}&cu=INR&mc=0000&tr=TXN${Date.now()}`;
            window.location.href = upiUrl;
        });
    </script>
</body>
</html>
