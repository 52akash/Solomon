<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Merchant Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .pay-card { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .merchant-header { text-align: center; margin-bottom: 25px; }
        .brand-logo { width: 60px; height: 60px; background: #2563eb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto 12px; }
        .brand-name { font-size: 20px; color: #1e293b; font-weight: 700; }
        .amount-display { text-align: center; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .amount-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .amount-value { font-size: 32px; color: #0f172a; font-weight: 800; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #475569; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #334155; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-pay { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-pay:hover { background: #1d4ed8; }
        .secure-footer { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 4px; }
    </style>
</head>
<body>

    <div class="pay-card">
        <div class="merchant-header">
            <div class="brand-logo" id="brandLogo">S</div>
            <div class="brand-name" id="brandName">Merchant Payment</div>
        </div>

        <div class="amount-display">
            <div class="amount-title">Amount Due</div>
            <div class="amount-value">₹<span id="paymentAmount">0.00</span></div>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="custName">Customer Name</label>
                <input type="text" id="custName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="custPhone">Mobile Number</label>
                <input type="tel" id="custPhone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
            <button type="submit" class="btn-pay">
                Pay via Any UPI App
            </button>
        </form>

        <div class="secure-footer">
            🛡️ PCI-DSS Certified & Secure Gateway
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amt') || '100'; 
        const brand = urlParams.get('brand') || 'Solomon Capital Pvt Ltd';

        document.getElementById('paymentAmount').innerText = parseFloat(amount).toFixed(2);
        document.getElementById('brandName').innerText = brand;
        document.getElementById('brandLogo').innerText = brand.charAt(0).toUpperCase();

        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;

            // Nayi Verified BharatPe Business UPI ID
            const myUpiId = "BHARATPE2T0X0V5G9B83837@unitype"; 
            const merchantName = brand;
            const transactionId = "TXN" + Date.now(); 
            
            const upiUrl = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(merchantName)}&am=${amount}&cu=INR&tr=${transactionId}`;

            window.location.href = upiUrl;
        });
    </script>
</body>
</html>
